name: smiley-synthetic-local
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: smiley-dev-postgres
    labels:
      com.smiley.local-runtime: synthetic
    env_file:
      - ./tmp/database-runtime/postgres.env
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - smiley-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "smiley_bootstrap", "-d", "sehospitaldb"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
volumes:
  smiley-postgres-data:
    name: smiley-dev-postgres-data
    labels:
      com.smiley.local-runtime: synthetic
