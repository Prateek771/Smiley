name: Application checks

on:
  push:
    branches: [main, dev, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application, database, and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-bootstrap-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Provision isolated database roles
        run: node scripts/ci-database.mjs
        env:
          CI_BOOTSTRAP_DATABASE_URL: postgresql://postgres:synthetic-ci-bootstrap-only@127.0.0.1:5432/postgres
      - name: Fresh foundation and additive migration regression
        run: node --import tsx --test tests/integration/database.test.ts
        env:
          NODE_ENV: test
      - name: Apply reviewed migrations
        run: npm run db:migrate
      - name: Seed fictional database records
        run: npm run db:seed
      - name: Server integration tests
        run: npm run test:integration
      - name: Verify browser CLI
        run: npm run browser -- --version
      - name: Lint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install browser for journeys
        run: npx playwright install --with-deps chromium
      - name: Browser journeys
        run: npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
