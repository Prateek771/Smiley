name: Application checks

on:
  push:
    branches: [main, dev, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application and native database checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start native isolated PostgreSQL 18
        shell: bash
        run: |
          if [ ! -x /usr/lib/postgresql/18/bin/initdb ]; then
            if ! apt-cache show postgresql-18 > /dev/null 2>&1; then
              sudo install -d /usr/share/postgresql-common/pgdg
              sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
              printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/smiley-pgdg.list > /dev/null
            fi
            sudo apt-get update
            sudo apt-get install -y postgresql-18
          fi
          printf '%s\n' 'synthetic-ci-bootstrap-only' > "$RUNNER_TEMP/smiley-pg-password"
          chmod 600 "$RUNNER_TEMP/smiley-pg-password"
          /usr/lib/postgresql/18/bin/initdb -D "$RUNNER_TEMP/smiley-pg-data" --username=postgres --pwfile="$RUNNER_TEMP/smiley-pg-password" --auth=scram-sha-256
          /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/smiley-pg-data" -l "$RUNNER_TEMP/smiley-pg.log" -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP" -w start
      - name: Provision isolated database roles
        run: node scripts/ci-database.mjs
        env:
          CI_BOOTSTRAP_DATABASE_URL: postgresql://postgres:synthetic-ci-bootstrap-only@127.0.0.1:55432/postgres
      - name: Fresh foundation and additive migration regression
        run: node --import tsx --test tests/integration/database.test.ts
        env:
          NODE_ENV: test
      - name: Apply reviewed migrations
        run: npm run db:migrate
      - name: Install pinned private queues
        run: npm run worker:setup && npm run worker:setup -- --test
      - name: Seed fictional database records
        run: npm run db:seed
      - name: Server integration tests
        run: npm run test:integration
      - name: Lint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Production HTTP checks
        run: npm run test:http
        env:
          HTTP_SKIP_BUILD: '1'
